{% include base_path %}

{% for file in site.static_files %}
    {% if file.path contains '/images/gallery/' %}
        <div class="responsive">
            <div class="gallery">
                <a target="_blank" href="{{ file.path | relative_url }}">
                <img src="{{ file.path | relative_url }}" width="600" height="400">
                </a>
            </div>
        </div>    
    {% endif %}
{% endfor %}
